<div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
  {% for m, label in [("long", "📦 Long-term holding"), ("swing", "〰 Swing trading"), ("day", "☀ Day trading")] %}
  <a href="/signals?mode={{ m }}" class="pill" style="padding:.45rem .9rem;font-size:.85rem;
     {{ 'background:var(--accent);color:#fff;border-color:var(--accent)' if mode == m }}">{{ label }}</a>
  {% endfor %}
</div>
